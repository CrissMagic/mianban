name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    env:
      UPDATE_REPOSITORY: ${{ github.repository }}
      EXPECTED_CERTIFICATE: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: version
        shell: bash
        run: |
          value=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [[ ! "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]{0,9})$ ]]; then
            echo 'Expected a version such as 0.3.4+8 in pubspec.yaml' >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          number=${BASH_REMATCH[2]}
          [[ "$number" -le 2100000000 ]]
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "Tag must be v$version" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_CERTIFICATE" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Set ANDROID_CERT_SHA256 in Actions variables' >&2
            exit 1
          fi
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_STEM=mianban-android-$version-$number" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter and Android SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Analyze and test
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build and verify signed APK
        shell: bash
        env:
          MIANBAN_SIGNED_RELEASE: 'true'
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_B64:?Missing ANDROID_KEYSTORE_B64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          umask 077
          key_directory=$(mktemp -d)
          export ANDROID_KEYSTORE_FILE="$key_directory/mianban.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"; rmdir "$key_directory"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset ANDROID_KEYSTORE_B64
          flutter build apk --release --dart-define="MIANBAN_UPDATE_REPOSITORY=$UPDATE_REPOSITORY"
          unset ANDROID_KEYSTORE_PASSWORD
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p release
          apk="$PACKAGE_STEM.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release/$apk"
          fingerprint=$("$build_tools/apksigner" verify --print-certs "release/$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$fingerprint" = "$EXPECTED_CERTIFICATE"
          metadata=$("$build_tools/aapt2" dump badging "release/$apk")
          expected="package: name='com.mianban.sleep' versionCode='${{ steps.version.outputs.build_number }}' versionName='$APP_VERSION'"
          [[ "$metadata" == "$expected"* ]]
          (cd release && sha256sum "$apk" > "$apk.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    concurrency:
      group: android-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release
          path: release/
      - name: Publish verified assets to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: bash tools/publish_android_release.sh "$UPDATE_REPOSITORY" "$GITHUB_REF_NAME" "$BUILD_NUMBER" release
