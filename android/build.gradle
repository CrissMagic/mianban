def localFlutterMaven = rootProject.file('../.tools/flutter-maven')

allprojects {
    repositories {
        if (localFlutterMaven.isDirectory()) {
            maven { url = uri(localFlutterMaven); content { includeGroup 'io.flutter' } }
        }
        google()
        mavenCentral()
    }
}
rootProject.layout.buildDirectory = file('../build')
subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
    evaluationDependsOn(':app')
}
